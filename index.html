<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>低圧蓄電池ビジネス投資 | 株式会社MEIZEN</title>
    <style>
        /* Reset & Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            color: #333333;
            line-height: 1.6;
            background-color: #f8fafc;
            padding: 20px 10px;
        }
        .battery-lp {
            max-width: 960px;
            margin: 0 auto;
        }
        section {
            margin-bottom: 40px;
            padding: 35px 25px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .land-toggle-container {
            border: 2px solid #004080;
            border-radius: 12px;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 40px;
        }
        .land-header {
            background: #ffffff;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            flex-wrap: wrap;
            gap: 15px;
        }
        .land-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .tag-orange {
            background-color: #e67e22;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 4px;
            white-space: nowrap;
        }
        .land-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: #004080;
        }
        .btn-toggle {
            background-color: #008080;
            color: #ffffff;
            border: none;
            padding: 8px 18px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s ease;
        }
        .btn-toggle:hover {
            background-color: #006666;
        }
        .sub-desc {
            font-size: 0.9rem;
            color: #666666;
            text-align: center;
            padding: 15px 20px 5px;
        }
        .land-content {
            padding: 15px 20px 25px;
        }
        .land-table-wrapper {
            overflow-x: auto;
        }
        table.land-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.95rem;
        }
        table.land-table th {
            background-color: #0f3c6c;
            color: #ffffff;
            padding: 12px;
            text-align: center;
            white-space: nowrap;
        }
        table.land-table td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: center;
        }
        table.land-table tr:nth-child(even) {
            background-color: #f8fafc;
        }
        .loading-text {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="battery-lp">
    <!-- 土地リストアコーディオン -->
    <div class="land-toggle-container">
        <div class="land-header">
            <div class="land-header-left">
                <span class="tag-orange">土地をお持ちでない方へ</span>
                <span class="land-title">【随時更新】低圧蓄電池 専用事業用地リスト</span>
            </div>
            <button class="btn-toggle" id="toggleBtn" onclick="toggleLandContent()">
                <span id="toggleText">開く / 閉じる</span> ▼
            </button>
        </div>

        <div id="landContent" class="land-content">
            <div class="sub-desc">
                3坪〜設置可能！格安適地を活用した土地セット対応案件一覧です。（※スプレッドシートから自動更新中）
            </div>
            <div class="land-table-wrapper">
                <table class="land-table">
                    <thead>
                        <tr>
                            <th>物件ID</th>
                            <th>エリア（場所）</th>
                            <th>土地面積</th>
                        </tr>
                    </thead>
                    <tbody id="landTableBody">
                        <tr>
                            <td colspan="3" class="loading-text">データを読み込み中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
function toggleLandContent() {
    const content = document.getElementById('landContent');
    if (content.style.display === 'none') {
        content.style.display = 'block';
    } else {
        content.style.display = 'none';
    }
}

// Google Visualization API を使用して純粋なCSVを取得（関数混入防止）
const sheetId = "1vS6ln4ROWVmzaO3FlkyXGrhy-fXlUjvx7AwQ96KvAEF";
const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv`;

fetch(csvUrl)
    .then(response => response.text())
    .then(csvText => {
        const lines = csvText.split('\n').map(line => line.trim()).filter(line => line.length > 0);
        const tbody = document.getElementById('landTableBody');
        tbody.innerHTML = '';

        // ヘッダーを除いたデータ行をループ処理
        let count = 0;
        for (let i = 1; i < lines.length; i++) {
            // カンマ区切り（クォーテーション考慮）
            const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/^"|"$/g, ''));
            
            // 異常な関数コードや空行をスキップする安全フィルター
            if (row.length < 2 || row[0].includes('function') || row[0].includes('object') || row[0].includes('String.prototype')) {
                continue;
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row[0] || '-'}</td>
                <td>${row[1] || '-'}</td>
                <td>${row[2] || '-'}</td>
            `;
            tbody.appendChild(tr);
            count++;
        }

        if (count === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:20px;">表示できる土地データがありません。</td></tr>';
        }
    })
    .catch(error => {
        console.error('Error fetching sheet:', error);
        document.getElementById('landTableBody').innerHTML = '<tr><td colspan="3" style="text-align:center; color:red; padding:20px;">データの読み込みに失敗しました。</td></tr>';
    });
</script>

</body>
</html>
